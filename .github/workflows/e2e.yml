name: E2E

# Playwright browser tests run against the live STAGING environment.
#
# Staging (the `develop` branch) is always deployed to Vercel + Railway, so
# E2E can drive the real deployed stack — no backend build/seed in CI, and no
# cross-repo checkout (this is why the old SERVER_REPO_TOKEN requirement is
# gone). The staging frontend URL comes from the repo variable
# STAGING_BASE_URL.
#
# Triggers:
#   - pull_request to main — the develop -> main promotion gate
#   - nightly schedule
#   - manual dispatch
#
# Set the repo variable STAGING_BASE_URL (Settings -> Secrets and variables ->
# Actions -> Variables) to the staging frontend URL once Vercel is wired up.
# Until then the job is skipped, so it never blocks a PR.
on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright E2E (staging)
    if: vars.STAGING_BASE_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      E2E_BASE_URL: ${{ vars.STAGING_BASE_URL }}
      CI: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
